// This file provides the necessary configuration for Flutter plugins
// to properly find the Flutter framework during builds

// Note: flutterRoot is defined in the main build.gradle file

if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

// Add Flutter embedding repository
repositories {
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-arm/maven"
    }
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-arm64/maven"
    }
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-x64/maven"
    }
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-x86/maven"
    }
}