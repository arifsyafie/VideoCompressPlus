group 'com.aravi.video_compress'
version '1.0'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// This is the standard Flutter plugin approach
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    // Try to get flutter SDK from environment variable
    flutterRoot = System.getenv('FLUTTER_ROOT')
}

// Use a simpler approach to Flutter dependencies instead of external gradle file
repositories {
    // Add Flutter's maven repository for embeddings
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-arm/maven"
    }
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-arm64/maven"
    }
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-x64/maven"
    }
    maven {
        url "$flutterRoot/bin/cache/artifacts/engine/android-x86/maven"
    }
}

android {
    namespace 'com.plugin.videocompress'
    compileSdkVersion 33

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
        allWarningsAsErrors = false
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn",
            "-Xskip-prerelease-check",
            "-Xdisable-default-scripting-plugin"
        ]
        verbose = true
    }
    
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "1.8"
        }
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    options.encoding = "UTF-8"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.annotation:annotation:1.6.0"
    implementation "androidx.core:core-ktx:1.9.0"
    implementation 'com.otaliastudios:transcoder:0.10.5'
    
    // Use a standard approach for Flutter plugin dependencies
    compileOnly files("$flutterRoot/bin/cache/artifacts/engine/android-arm/flutter.jar")
}
